# LSR — where this project's secrets live.
#
# Copy to the root of the lsr repository as .secretman.yaml. secretman finds it
# by walking up from the working directory, so it runs from anywhere inside.
#
# This is the whole file. No secret is named here, so it cannot be wrong about
# one: what exists is read from GitHub and Secret Manager on every run.

github:
  # Omit to let gh resolve the repository from the working directory.
  repo: ObsidianCodes/lsr

gcp:
  # The project ID, not the display name. They are often different.
  project: lifespanrecords
  # Everything carrying this prefix is LSR's. Everything else in the GCP
  # project is somebody else's, and is never listed, walked or written.
  prefix: lsr-
