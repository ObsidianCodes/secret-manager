# LSR — WorkOS credentials.
#
# Copy this to the root of the lsr repository as .secretman.yaml. secretman
# finds it by walking up from the working directory, so it can be run from
# anywhere inside the repo.
#
# Names only. No value, no digest. Committed on purpose.

project: lsr

github:
  # Omit to let gh resolve the repository from the working directory.
  repo: ObsidianCodes/lsr

gcp:
  project: lifespanrecords
  # Prefixed so several projects can share one GCP project without colliding.
  prefix: lsr-

environments:
  # gcpSuffix is what distinguishes the Secret Manager names, because Secret
  # Manager has no concept of an environment. An explicit "" is production's:
  # the name most consumers reference should not carry a suffix.
  - name: production
    gcpSuffix: ""
  - name: staging
    gcpSuffix: "-staging"
  - name: development
    gcpSuffix: "-dev"

secrets:
  - key: workos-api-key
    name: WORKOS_API_KEY
    label: WorkOS secret key
    help: Dashboard › API Keys, the one starting sk_

  - key: workos-client-id
    name: WORKOS_CLIENT_ID
    label: WorkOS client id
    help: Dashboard › API Keys, immediately above the secret key

  - key: workos-claim-token
    name: WORKOS_CLAIM_TOKEN
    label: WorkOS claim token

  - key: workos-cookie-password
    name: WORKOS_COOKIE_PASSWORD
    label: Session cookie sealing key
    help: Invented, not issued — generate it at the prompt

  - key: workos-redirect-uri
    name: WORKOS_REDIRECT_URI
    label: OAuth redirect URI
    help: Must match the Redirect URI registered in the WorkOS dashboard, exactly
