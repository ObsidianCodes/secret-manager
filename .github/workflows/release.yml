name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: tag to build and release
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: check
        run: make check

      - name: build
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}
            arch=${target#*/}
            out="dist/secretman"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X github.com/ObsidianCodes/secret-manager/cmd.Version=$TAG" \
              -o "$out" .
            tar -czf "dist/secretman_${TAG}_${os}_${arch}.tar.gz" -C dist secretman
            rm "$out"
          done
          cd dist && sha256sum *.tar.gz > checksums.txt

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber \
            || gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
                 --title "$TAG" --generate-notes
